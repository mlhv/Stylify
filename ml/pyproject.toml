[project]
name = "stylify-ml"
version = "0.1.0"
description = "Training and export pipeline for the Stylify clothing classifier"
authors = [
    { name = "Minh Le", email = "levuhoangminh1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "timm==1.0.30",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
# Only `export` needs ExecuTorch. The gaming PC trains without it: `uv sync --no-group export`.
export = [
    "executorch==1.5.1",
]

[tool.uv]
default-groups = ["dev", "export"]
