name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # mobile/ shares this lockfile. --filter skips its dependencies; --omit=peer
      # stops an optional peer of the server's Kinde SDK (expo-secure-store) from
      # pulling in Expo and React Native. The frontend typecheck reads server types.
      - name: Install dependencies
        run: bun install --frozen-lockfile --omit=peer --filter frontend --filter server

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync frontend/dist/ s3://stylify-frontend/ --delete --region us-east-1

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EIH8J5L7N96GZ \
            --paths "/*" \
            --region us-east-1
