name: Test Infra

# The CloudFront Function is published by hand (docs/cloud-architecture.md).
# This only runs its tests; it deploys nothing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/test-infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/test-infra.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # The tests use only bun:test and Node built-ins, so nothing is installed.
      - name: Test
        run: bun test ./infra
